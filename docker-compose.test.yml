version: "3.8"

services:
  postgres_test:
    image: postgres:16
    container_name: ceo-postgres-test
    environment:
      POSTGRES_DB: ceo_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ceo_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    container_name: ceo-redis-test
    tmpfs: /data
    ports:
      - "6380:6379"

  backend_test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceo-backend-test
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres_test:5432/ceo_test
      REDIS_URL: redis://redis_test:6379/0
      OPENAI_API_KEY: test-key
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o
      SECRET_KEY: test-secret
      ENVIRONMENT: test
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_started
    command: pytest tests/ -v --cov=app --cov-fail-under=80