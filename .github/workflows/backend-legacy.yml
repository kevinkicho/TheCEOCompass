# Optional legacy FastAPI suite — not required for the static + Firebase product path.
name: Backend Legacy

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install fastapi uvicorn sqlalchemy aiosqlite httpx pydantic pydantic-settings pydantic-core
          pip install pytest pytest-asyncio pytest-cov pytest-mock

      - name: Run backend unit tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///test.db
          PYTHONPATH: backend
          ENVIRONMENT: test
        run: python -m pytest backend/tests/unit/ -v --tb=short --no-cov
