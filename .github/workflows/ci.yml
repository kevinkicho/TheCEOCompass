name: CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install fastapi uvicorn sqlalchemy aiosqlite httpx pydantic pydantic-settings pydantic-core
          pip install pytest pytest-asyncio pytest-cov pytest-mock

      - name: Run backend unit tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///test.db
          PYTHONPATH: backend
          ENVIRONMENT: test
        run: python -m pytest backend/tests/unit/ -v --tb=short --no-cov

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run frontend tests
        run: |
          cd frontend
          npx vitest run

  frontend-build:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Verify Next.js build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:50128
        run: |
          cd frontend
          npx next build