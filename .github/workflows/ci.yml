name: CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy aiosqlite httpx pydantic pydantic-settings
          pip install pytest pytest-asyncio pytest-cov pytest-mock

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          PYTHONPATH: backend
          ENVIRONMENT: test
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --ignore=tests/integration 2>&1
          python -m pytest tests/unit/ -v --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run frontend typecheck
        run: npx tsc --noEmit --project frontend/tsconfig.json 2>&1 | head -30 || true

      - name: Run frontend lint
        run: npm run lint --prefix frontend 2>&1 || true

      - name: Run frontend unit tests
        run: npm run test --prefix frontend 2>&1 || true

  build-check:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install fastapi uvicorn sqlalchemy aiosqlite pydantic pydantic-settings

      - name: Install JS deps
        run: npm ci --prefix frontend

      - name: Verify Next.js build compiles
        run: cd frontend && npx next build 2>&1 | tail -15

      - name: Verify backend imports cleanly
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          ENVIRONMENT: test
        run: python -c "from app.main import app; print('Backend imports OK:', app.title)"